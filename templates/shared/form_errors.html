{% load i18n ui %}
{% if form.errors %}<div class="error-summary" role="alert" tabindex="-1" data-error-summary>
<h2>{% icon 'help' %}{% translate 'Vérifiez les informations saisies' %}</h2>{{ form.non_field_errors }}
<ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }} : {{ field.errors|striptags }}</a></li>{% endif %}{% endfor %}</ul></div>{% endif %}
