{% extends 'base.html' %}
{% block content %}
<section class="panel form-panel"><h1>{{ title|default:'Configuration' }}</h1>
{% if event %}<p><a href="{{ event.get_absolute_url }}">{{ event }}</a> · Horaires : Africa/Tunis</p>{% endif %}
<form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button type="submit">{{ button_label|default:'Enregistrer' }}</button></form></section>
{% endblock %}
