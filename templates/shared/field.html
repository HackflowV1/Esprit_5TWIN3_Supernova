{% load i18n %}
{% if field.is_hidden %}{{ widget }}{% else %}
<div class="field field--{{ field.name }}{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field--checkbox{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if conditional %}<span class="optional"> ({% translate 'si sélectionné' %})</span>{% elif field.field.required %}<span class="required-mark" aria-hidden="true"> *</span><span class="visually-hidden"> ({% translate 'obligatoire' %})</span>{% else %}<span class="optional"> ({% translate 'facultatif' %})</span>{% endif %}</label>
  {{ widget }}
  {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="field-error" id="{{ field.auto_id }}_error">{{ field.errors }}</div>{% endif %}
</div>
{% endif %}
