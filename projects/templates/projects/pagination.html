{% load i18n %}{% if projects.has_other_pages %}<nav class="actions" aria-label="{% translate 'Pagination' %}">{% if projects.has_previous %}<a class="button secondary" href="?{{ pagination_query }}&amp;page={{ projects.previous_page_number }}">{% translate 'Précédent' %}</a>{% endif %}<span>{{ projects.number }} / {{ projects.paginator.num_pages }}</span>{% if projects.has_next %}<a class="button secondary" href="?{{ pagination_query }}&amp;page={{ projects.next_page_number }}">{% translate 'Suivant' %}</a>{% endif %}</nav>{% endif %}
