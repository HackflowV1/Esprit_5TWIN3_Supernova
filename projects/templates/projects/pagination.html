{% load i18n %}{% if projects.has_other_pages %}<nav class="actions" aria-label="{% translate 'Pagination' %}">{% if projects.has_previous %}<a class="button secondary" href="?page={{ projects.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}">{% translate 'Précédent' %}</a>{% endif %}<span>{{ projects.number }} / {{ projects.paginator.num_pages }}</span>{% if projects.has_next %}<a class="button secondary" href="?page={{ projects.next_page_number }}&amp;q={{ request.GET.q|urlencode }}">{% translate 'Suivant' %}</a>{% endif %}</nav>{% endif %}
