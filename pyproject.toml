[project]
name = "hackflow"
version = "0.1.0"
description = "HackFlow — Plateforme web de gestion des hackathons étudiants"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "Pillow>=10.4.0",
    "google-generativeai>=0.8.0",
    "psycopg[binary]>=3.2,<4",
    "google-genai>=2.33.0",
    "fastembed>=0.7,<0.10",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "polib>=1.2.0",
]
